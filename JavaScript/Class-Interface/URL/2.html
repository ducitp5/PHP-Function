<!--<h2> JavaScript - Blob URL </h2>-->
<a href = "#" target="_blank" id = "download"> Download Text File </a>
<br>
<a href = "#" target="_blank" id = "download2"> Download Text File 2 </a>

<script>

    const blob = new Blob(
        ['Hello, world!'],
        { type: 'text/plain' }
    );

    const blobUrl = URL.createObjectURL(blob);

    console.log('blobUrl - ', blobUrl); // "blob:<generated-url>"
    var a = document.getElementById("download");
    a.href = blobUrl;

    var a2 = document.getElementById("download2");
    const blobUrl2 = URL.createObjectURL(blob);
    console.log('blobUrl2 - ', blobUrl2); // "blob:<generated-url>"

    a2.href = blobUrl2;

    URL.revokeObjectURL(blobUrl +'ab');
