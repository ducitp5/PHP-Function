<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Promise Example</title>
</head>
<body>

<h1 id="demo"></h1>

<script>

    const p1 = Promise.resolve(100)
    const p2 = Promise.resolve(true)
    const p3 = Promise.reject('error')

    console.log(1111, p1, p2, p3);

    const p4 = new Promise((resolve, reject) => {
        setTimeout(() => {
            resolve("p4")
        }, 2000)
    })

    let $pp1 = Promise.all([p1,p2,p4])
    .then(
        data => {
            console.log('p1,p2,p4', data)
        }
    )
    .catch(
        err => {
            console.log('err - p1,p2,p4', err)
        }
    )

    console.log('$pp1 - ', $pp1);

    $pp2 = Promise.all([p1,p2,p3,p4])
        .then(data => {
            console.log('p1,p2,p3,p4', data)
        })
        .catch(err => {
            console.log('err - p1,p2,p3,p4', err)
        })

    console.log('$pp2 - ', $pp2);

    // p1,p2,p3,p4 error
    // p1,p2,p4 [ 100, true, 'p4' ]

</script>

</body>
</html>
