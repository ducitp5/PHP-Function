<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Promise Example</title>
</head>
<body>

<h1 id="demo"></h1>

<script>

    // Create Promises
    const myPromise1 = new Promise((resolve) =>
        setTimeout(resolve, 4000, "King")
    );

    const myPromise2 = new Promise((resolve) => {
        setTimeout(resolve, 3000, "Queen");
    });

    const myPromise3 = new Promise((resolve) => {
        setTimeout(resolve, 1500, "Sai Rui");
    });

    const myPromise4 = new Promise((resolve) => {
        setTimeout(resolve, 1500, "Sai2");
    });

    console.log(1111, myPromise1)
    // Display each promise as soon as it is resolved
    myPromise1.then((value) => {
        console.log(value);
        myDisplay(value);
        console.log(2222, myPromise1)

    });

    myPromise2.then((value) => {
        console.log(value);
        myDisplay(value);
    });

    myPromise3.then((value) => {
        console.log(value);
        myDisplay(value);
    });

    myPromise4.then((value) => {
        console.log(value);
        myDisplay(value);
    });

    // Function to display result in the DOM
    function myDisplay(some) {
        document.getElementById("demo").innerHTML += some + " ";
    }

</script>

</body>
</html>
